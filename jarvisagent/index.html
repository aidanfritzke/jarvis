<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<!-- PWA / Add-to-Home-Screen -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#16171a">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,Segoe UI,sans-serif; background:#16171a; color:#e8e8e8;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
           font-weight:600; border-bottom:1px solid #2a2c30; display:flex; justify-content:space-between; align-items:center; }
  .newbtn { border:1px solid #3a3d44; background:#1e2024; color:#cfd2d6; font-size:13px; padding:5px 10px; border-radius:8px; cursor:pointer; }
  .newbtn:hover { background:#26282d; }
  .conn { font-size:12px; font-weight:400; margin-left:6px; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; line-height:1.4; }
  .you { align-self:flex-end; background:#2563eb; }
  .bot { align-self:flex-start; background:#26282d; }
  .working { align-self:flex-start; background:#26282d; color:#9aa0a6; font-style:italic;
             display:flex; align-items:center; gap:8px; animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
  .cancelbtn { border:0; background:transparent; color:#9aa0a6; font-size:15px; cursor:pointer; padding:0 4px; }
  .cancelbtn:hover { color:#fff; }
  .pending { align-self:stretch; background:#3a2a12; border:1px solid #7a5a1a; padding:10px; border-radius:10px; }
  .pending button { margin:8px 8px 0 0; padding:7px 13px; border:0; border-radius:8px; font-weight:600; }
  .confirm { background:#dc2626; color:#fff; }
  .dismiss { background:#3a3d44; color:#ddd; }
  form { display:flex; gap:8px; align-items:flex-end; padding:10px; border-top:1px solid #2a2c30; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  textarea { flex:1; padding:12px; border-radius:10px; border:1px solid #3a3d44; background:#1e2024; color:#fff; font-size:16px;
             font-family:inherit; line-height:1.35; resize:none; max-height:40vh; overflow-y:auto; }
  button.send { padding:12px 16px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-weight:600; white-space:nowrap; }
</style>
</head>
<body>
<header><span>Jarvis <span id="conn" class="conn"></span></span><button id="newchat" class="newbtn">New chat</button></header>
<div id="log"></div>
<form id="f"><textarea id="m" rows="1" placeholder="Ask Jarvis…" autocomplete="off"></textarea><button class="send">Send</button></form>
<script>
  const log = document.getElementById('log'), f = document.getElementById('f'), m = document.getElementById('m');
  const sid = 'web';

  document.getElementById('newchat').onclick = async () => {
    try { await fetch('/chat/reset', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({session_id:sid})}); } catch (e) {}
    log.innerHTML = '';
    add('New conversation started.', 'bot');
  };

  // --- push notifications: always on (no button) ---
  // Browsers require ONE user gesture to grant permission, so on the very first visit we ask on
  // the first tap anywhere. After that it re-subscribes silently on every open and delivers while closed.
  function urlB64ToUint8(base64) {
    const pad = '='.repeat((4 - base64.length % 4) % 4);
    const b64 = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b64); const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  async function subscribePush() {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { key } = await (await fetch('/push/vapid')).json();
      if (!key) return;
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(key) });
    }
    await fetch('/push/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(sub) });
  }
  async function ensurePush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    try { await navigator.serviceWorker.register('/sw.js'); } catch (e) { return; }
    if (Notification.permission === 'granted') { subscribePush().catch(() => {}); return; }
    if (Notification.permission === 'default') {
      const ask = async () => {
        document.removeEventListener('click', ask);
        try { if ((await Notification.requestPermission()) === 'granted') await subscribePush(); } catch (e) {}
      };
      document.addEventListener('click', ask, { once: true });
    }
  }
  ensurePush();
  const POLL_MS = 1500, MAX_POLLS = 200;  // ~5 min ceiling

  function add(text, cls) {
    const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }

  function showPending(p) {
    const d = document.createElement('div'); d.className = 'pending';
    const t = document.createElement('div'); t.textContent = '⚠ Needs confirmation: ' + p.summary; d.appendChild(t);
    const c = document.createElement('button'); c.className = 'confirm'; c.textContent = 'Confirm';
    const x = document.createElement('button'); x.className = 'dismiss'; x.textContent = 'Dismiss';
    c.onclick = async () => {
      c.disabled = true;
      const r = await fetch('/confirm', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({session_id:sid})});
      const j = await r.json(); add(j.result || JSON.stringify(j), 'bot'); d.remove();
    };
    x.onclick = () => d.remove();
    d.appendChild(c); d.appendChild(x); log.appendChild(d); log.scrollTop = log.scrollHeight;
  }

  // Poll a job to completion. Backgrounding just pauses this; it resumes on return.
  function poll(jobId, bubble, label, tries, state) {
    if (state.stopped) return;
    fetch('/chat/status/' + jobId).then(r => {
      if (r.status === 404) { bubble.className = 'msg bot'; bubble.textContent = '(this result expired — ask again)'; return null; }
      return r.json();
    }).then(j => {
      if (!j || state.stopped) return;
      if (j.status === 'working') {
        label.textContent = j.progress || 'Working…';
        if (tries < MAX_POLLS) setTimeout(() => poll(jobId, bubble, label, tries + 1, state), POLL_MS);
        else { bubble.className = 'msg bot'; bubble.textContent = '(still working — check back shortly)'; }
        return;
      }
      bubble.className = 'msg bot';
      if (j.status === 'cancelled') { bubble.textContent = '(cancelled)'; return; }
      if (j.status === 'error') { bubble.textContent = 'error: ' + (j.error || 'unknown'); return; }
      bubble.textContent = j.reply || '(no reply)';
      if (j.pending) showPending(j.pending);
    }).catch(() => {
      // transient network hiccup (e.g. just back from background) — keep trying
      if (!state.stopped && tries < MAX_POLLS) setTimeout(() => poll(jobId, bubble, label, tries + 1, state), POLL_MS);
    });
  }

  // grow the textarea to fit its content (up to max-height, then it scrolls)
  function autosize() { m.style.height = 'auto'; m.style.height = Math.min(m.scrollHeight, Math.round(window.innerHeight * 0.4)) + 'px'; }
  m.addEventListener('input', autosize);

  // Connection indicator — makes a slow far-from-home open look like it's working, not frozen.
  const conn = document.getElementById('conn');
  function setConn(state) {
    if (state === 'connecting') { conn.textContent = '• connecting…'; conn.style.color = '#d0a24a'; }
    else if (state === 'connected') { conn.textContent = ''; }
    else { conn.textContent = '• offline'; conn.style.color = '#dc6a6a'; }
  }

  // Warm the Tailscale tunnel on open — far from home it can take a few seconds to connect,
  // so we start that now (while you read/type) instead of on your first message.
  (function warm(n) {
    setConn('connecting');
    fetch('/health').then(r => { if (!r.ok) throw 0; setConn('connected'); })
      .catch(() => { if (n > 0) setTimeout(() => warm(n - 1), 1500); else setConn('offline'); });
  })(6);

  // Retry the initial send a few times: from far away the tunnel may still be establishing,
  // so a first attempt that fails should just recover rather than error out.
  async function postWithRetry(url, opts, tries, state, onRetry) {
    for (let i = 0; i < tries; i++) {
      if (state && state.stopped) throw new Error('cancelled');
      try { const r = await fetch(url, opts); setConn('connected'); return r; }
      catch (e) {
        if (i === tries - 1) { setConn('offline'); throw e; }
        setConn('connecting'); if (onRetry) onRetry();
        await new Promise(r => setTimeout(r, 1500));
      }
    }
  }

  f.onsubmit = async (e) => {
    e.preventDefault();
    const text = m.value.trim(); if (!text) return;
    add(text, 'you'); m.value = ''; autosize();

    // working bubble = progress label + a cancel (✕) button
    const bubble = document.createElement('div'); bubble.className = 'msg working';
    const label = document.createElement('span'); label.textContent = 'Thinking… (safe to lock your phone)';
    const cancel = document.createElement('button'); cancel.className = 'cancelbtn'; cancel.textContent = '✕'; cancel.title = 'Cancel';
    bubble.appendChild(label); bubble.appendChild(cancel);
    log.appendChild(bubble); log.scrollTop = log.scrollHeight;

    const state = { stopped: false, jobId: null };
    cancel.onclick = async () => {
      state.stopped = true;
      bubble.className = 'msg bot'; bubble.textContent = '(cancelled)';
      if (state.jobId) { try { await fetch('/chat/cancel/' + state.jobId, {method:'POST'}); } catch (e) {} }
    };

    try {
      const r = await postWithRetry('/chat', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({message:text, session_id:sid})}, 4, state, () => { label.textContent = 'Connecting…'; });
      const j = await r.json();
      state.jobId = j.job_id;
      if (state.stopped) { try { await fetch('/chat/cancel/' + j.job_id, {method:'POST'}); } catch (e) {} return; }
      poll(j.job_id, bubble, label, 0, state);
    } catch (err) {
      if (!state.stopped) { bubble.className = 'msg bot'; bubble.textContent = 'error: ' + err; }
    }
  };
</script>
</body>
</html>
